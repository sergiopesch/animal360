<template>
  <lightning-card>
    <div class="shell">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Animal360 Estate Whiteboard</p>
          <h2>{mapTitle}</h2>
          <div class="status-row">
            <lightning-badge label={mapStatusLabel}></lightning-badge>
            <lightning-badge
              label={modeLabel}
              class={modeVariant}
            ></lightning-badge>
            <span>{totalsLabel}</span>
          </div>
        </div>

        <div class="toolbar-actions">
          <lightning-combobox
            variant="label-hidden"
            label="Species"
            value={speciesFilter}
            options={speciesOptions}
            onchange={handleSpeciesFilter}
          ></lightning-combobox>
          <lightning-combobox
            variant="label-hidden"
            label="Risk"
            value={riskFilter}
            options={riskOptions}
            onchange={handleRiskFilter}
          ></lightning-combobox>
          <template if:true={canEdit}>
            <lightning-button
              label={toggleEditLabel}
              onclick={handleToggleEdit}
            ></lightning-button>
          </template>
        </div>
      </header>

      <template if:true={hasMap}>
        <div class={workspaceClass}>
          <section class="map-wrap" aria-label="Animal estate map">
            <div class={mapCanvasClass} style={mapCanvasStyle}>
              <svg
                class="connection-layer"
                viewBox="0 0 100 100"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <template for:each={connectionLines} for:item="line">
                  <line
                    key={line.id}
                    x1={line.x1}
                    y1={line.y1}
                    x2={line.x2}
                    y2={line.y2}
                    stroke={line.stroke}
                    stroke-width="0.45"
                    stroke-linecap="round"
                    stroke-dasharray="1.5 1"
                  ></line>
                </template>
              </svg>

              <template for:each={mapAreas} for:item="area">
                <button
                  key={area.id}
                  class={area.className}
                  style={area.style}
                  data-id={area.id}
                  onpointerdown={handleAreaPointerDown}
                  title={area.label}
                >
                  <span class={area.sceneClass} aria-hidden="true">
                    <span class="area-scene-icon"></span>
                    <span class="area-scene-detail"></span>
                  </span>
                  <span class="area-label">{area.label}</span>
                  <span class="area-zone">{area.zone}</span>
                  <span class={area.statusClass} style={area.statusStyle}
                    >{area.statusLabel}</span
                  >
                  <span class={area.occupancyClass}>{area.occupancyLabel}</span>
                  <template if:true={editMode}>
                    <span
                      class="resize-handle"
                      data-id={area.id}
                      onpointerdown={handleAreaResizePointerDown}
                    ></span>
                  </template>
                </button>
              </template>

              <template for:each={animalTokens} for:item="animal">
                <button
                  key={animal.key}
                  class={animal.className}
                  style={animal.style}
                  title={animal.title}
                  aria-label={animal.title}
                  aria-pressed={animal.isSelected}
                  data-animal-id={animal.animalId}
                  onpointerdown={handleAnimalPointerDown}
                >
                  <span
                    class="pet-avatar"
                    style={animal.avatarStyle}
                    aria-hidden="true"
                  >
                    <span class="pet-shadow"></span>
                    <span class="pet-tail"></span>
                    <span class="pet-body" style={animal.bodyStyle}></span>
                    <span class="pet-head" style={animal.headStyle}>
                      <span class="pet-ear pet-ear-left"></span>
                      <span class="pet-ear pet-ear-right"></span>
                      <span class="pet-face">
                        <span class="pet-eye pet-eye-left"></span>
                        <span class="pet-eye pet-eye-right"></span>
                        <span class="pet-nose"></span>
                        <span class="pet-mark"></span>
                        <span class="pet-whisker pet-whisker-left"></span>
                        <span class="pet-whisker pet-whisker-right"></span>
                        <span class="pet-beak"></span>
                      </span>
                    </span>
                    <span class="pet-wing"></span>
                    <span class="pet-leg pet-leg-left"></span>
                    <span class="pet-leg pet-leg-right"></span>
                  </span>
                  <span class="animal-name" style={animal.nameStyle}
                    >{animal.animalName}</span
                  >
                  <span class="move-label">{animal.moveLabel}</span>
                </button>
              </template>

              <template if:true={isCanvasUpdating}>
                <div class="canvas-saving" role="status">
                  {canvasSavingLabel}
                </div>
              </template>
            </div>
          </section>

          <template if:true={editMode}>
            <aside class="editor">
              <div class="editor-header">
                <h3>{selectedAreaName}</h3>
                <lightning-button-icon
                  icon-name="utility:add"
                  alternative-text="Add area"
                  title="Add area"
                  onclick={handleAddArea}
                ></lightning-button-icon>
              </div>

              <section class="editor-section">
                <h4>Canvas</h4>
                <lightning-input
                  label="Map Name"
                  value={mapSettings.mapName}
                  data-field="mapName"
                  onchange={handleMapSettingChange}
                ></lightning-input>
                <div class="grid">
                  <lightning-input
                    type="number"
                    label="Width"
                    value={mapSettings.canvasWidth}
                    data-field="canvasWidth"
                    min="800"
                    max="2400"
                    onchange={handleMapSettingChange}
                  ></lightning-input>
                  <lightning-input
                    type="number"
                    label="Height"
                    value={mapSettings.canvasHeight}
                    data-field="canvasHeight"
                    min="480"
                    max="1600"
                    onchange={handleMapSettingChange}
                  ></lightning-input>
                </div>
                <lightning-combobox
                  label="Background"
                  value={mapSettings.backgroundStyle}
                  options={backgroundOptions}
                  data-field="backgroundStyle"
                  onchange={handleMapSettingChange}
                ></lightning-combobox>
              </section>

              <template if:true={hasSelectedArea}>
                <section class="editor-section">
                  <h4>Area</h4>
                  <lightning-input
                    label="Label"
                    value={selectedArea.label}
                    data-field="label"
                    onchange={handleFieldChange}
                  ></lightning-input>
                  <lightning-input
                    label="Zone"
                    value={selectedArea.zone}
                    data-field="zone"
                    onchange={handleFieldChange}
                  ></lightning-input>
                  <lightning-combobox
                    label="Shape"
                    value={selectedArea.shape}
                    options={areaShapeOptions}
                    data-field="shape"
                    onchange={handleFieldChange}
                  ></lightning-combobox>
                  <lightning-combobox
                    label="Area Status"
                    value={selectedArea.operationalStatus}
                    options={areaStatusOptions}
                    data-field="operationalStatus"
                    onchange={handleFieldChange}
                  ></lightning-combobox>
                  <lightning-combobox
                    label="Housing Unit"
                    value={selectedArea.housingUnitId}
                    options={housingOptions}
                    data-field="housingUnitId"
                    onchange={handleFieldChange}
                  ></lightning-combobox>
                  <div class="grid">
                    <lightning-input
                      type="number"
                      label="X"
                      value={selectedArea.x}
                      data-field="x"
                      onchange={handleFieldChange}
                    ></lightning-input>
                    <lightning-input
                      type="number"
                      label="Y"
                      value={selectedArea.y}
                      data-field="y"
                      onchange={handleFieldChange}
                    ></lightning-input>
                    <lightning-input
                      type="number"
                      label="Width"
                      value={selectedArea.width}
                      data-field="width"
                      onchange={handleFieldChange}
                    ></lightning-input>
                    <lightning-input
                      type="number"
                      label="Height"
                      value={selectedArea.height}
                      data-field="height"
                      onchange={handleFieldChange}
                    ></lightning-input>
                  </div>
                  <div class="grid">
                    <lightning-input
                      type="number"
                      label="Rotation"
                      value={selectedArea.rotation}
                      data-field="rotation"
                      onchange={handleFieldChange}
                    ></lightning-input>
                    <lightning-input
                      label="Fill Color"
                      value={selectedArea.fillColor}
                      data-field="fillColor"
                      onchange={handleFieldChange}
                    ></lightning-input>
                  </div>
                  <div class="area-tools">
                    <lightning-button
                      label="Split Vertical"
                      onclick={handleSplitVertical}
                    ></lightning-button>
                    <lightning-button
                      label="Split Horizontal"
                      onclick={handleSplitHorizontal}
                    ></lightning-button>
                    <lightning-button
                      label="Remove"
                      variant="destructive-text"
                      onclick={handleRemoveArea}
                    ></lightning-button>
                  </div>
                </section>
              </template>

              <div class="editor-actions">
                <lightning-button
                  label="Save Layout"
                  variant="brand"
                  disabled={isSaving}
                  onclick={handleSave}
                ></lightning-button>
                <lightning-button
                  label="Publish"
                  disabled={isSaving}
                  onclick={handlePublish}
                ></lightning-button>
              </div>
            </aside>
          </template>

          <template if:true={showOperationsPanel}>
            <aside class="editor operations-panel">
              <div class="editor-header">
                <h3>{selectedAreaName}</h3>
                <div class="operations-header-actions">
                  <lightning-badge label={selectedAreaStatus}></lightning-badge>
                  <lightning-button
                    label={addAnimalToggleLabel}
                    icon-name="utility:add"
                    disabled={addAnimalToggleDisabled}
                    onclick={handleToggleAddAnimal}
                  ></lightning-button>
                </div>
              </div>

              <template if:true={hasSelectedArea}>
                <lightning-combobox
                  label="Area Status"
                  value={selectedAreaStatus}
                  options={areaStatusOptions}
                  disabled={isSaving}
                  onchange={handleAreaStatusChange}
                ></lightning-combobox>

                <div class="area-roster">
                  <span class="area-roster-count"
                    >{selectedAreaAnimalCount}</span
                  >
                  <template
                    for:each={selectedAreaAnimals}
                    for:item="areaAnimal"
                  >
                    <span key={areaAnimal.id} class="area-roster-item">
                      {areaAnimal.label}
                    </span>
                  </template>
                </div>

                <template if:true={addAnimalPanelOpen}>
                  <section class="add-animal-panel" aria-label="Add animal">
                    <div class="add-animal-search">
                      <lightning-input
                        type="search"
                        label="Find Animal"
                        value={animalSearchTerm}
                        disabled={addAnimalSearchDisabled}
                        onchange={handleAnimalSearchTermChange}
                        onkeyup={handleAnimalSearchKeyUp}
                      ></lightning-input>
                      <lightning-button
                        label="Search"
                        disabled={addAnimalSearchDisabled}
                        onclick={handleAnimalSearch}
                      ></lightning-button>
                    </div>

                    <template if:true={isSearchingAnimals}>
                      <div class="add-animal-status" role="status">
                        Searching animals
                      </div>
                    </template>

                    <template if:true={addAnimalPanelMessage}>
                      <p class="add-animal-message">{addAnimalPanelMessage}</p>
                    </template>

                    <template if:true={hasAnimalSearchResults}>
                      <div class="animal-add-list">
                        <template for:each={addAnimalResults} for:item="animal">
                          <button
                            key={animal.animalId}
                            class={animal.className}
                            data-animal-id={animal.animalId}
                            onclick={handleSelectAddAnimal}
                          >
                            <template if:true={animal.primaryImageUrl}>
                              <img
                                src={animal.primaryImageUrl}
                                alt={animal.imageAlt}
                              />
                            </template>
                            <template if:false={animal.primaryImageUrl}>
                              <span class="animal-add-placeholder">
                                {animal.animalName}
                              </span>
                            </template>
                            <span class="animal-add-copy">
                              <strong>{animal.animalName}</strong>
                              <span>{animal.detailLabel}</span>
                              <em>{animal.locationLabel}</em>
                            </span>
                          </button>
                        </template>
                      </div>
                      <lightning-button
                        label="Add to Area"
                        variant="brand"
                        disabled={addAnimalActionDisabled}
                        onclick={handleAddAnimalToArea}
                      ></lightning-button>
                    </template>
                  </section>
                </template>
              </template>

              <template if:true={hasSelectedAnimal}>
                <section class="animal-tag" aria-label={selectedAnimalTagLabel}>
                  <div class="animal-tag-hole" aria-hidden="true"></div>
                  <div class="animal-tag-topline">
                    <p class="panel-kicker">Animal Tag</p>
                    <span class={selectedAnimalRiskClass}
                      >{selectedAnimal.welfareRisk}</span
                    >
                  </div>

                  <div class="animal-tag-identity">
                    <a
                      class="animal-tag-image"
                      href={selectedAnimalRecordUrl}
                      aria-label={selectedAnimalRecordLabel}
                    >
                      <template if:true={hasSelectedAnimalImage}>
                        <img
                          class="animal-tag-photo"
                          src={selectedAnimalImageUrl}
                          alt={selectedAnimalImageLabel}
                        />
                      </template>
                      <template if:false={hasSelectedAnimalImage}>
                        <div class="animal-tag-photo-placeholder" role="img">
                          <span>{selectedAnimalName}</span>
                        </div>
                      </template>
                    </a>

                    <div class="animal-tag-nameplate">
                      <span class="animal-tag-number"
                        >{selectedAnimal.animalRecordName}</span
                      >
                      <h3>{selectedAnimalName}</h3>
                      <p>{selectedAnimalPrimaryLine}</p>
                    </div>
                  </div>

                  <div class="animal-tag-actions">
                    <lightning-button
                      label={selectedAnimalDetailsToggleLabel}
                      onclick={handleToggleAnimalDetails}
                    ></lightning-button>
                  </div>

                  <template if:true={selectedAnimalDetailsOpen}>
                    <section
                      class="animal-detail-drilldown"
                      aria-label="Animal detail drilldown"
                    >
                      <div class="animal-photo-card">
                        <template if:true={hasSelectedAnimalImage}>
                          <img
                            class="animal-photo"
                            src={selectedAnimalImageUrl}
                            alt={selectedAnimalImageLabel}
                          />
                        </template>
                        <template if:false={hasSelectedAnimalImage}>
                          <div class="animal-photo-placeholder" role="img">
                            <span>{selectedAnimalName}</span>
                          </div>
                        </template>
                        <p>{selectedAnimalImageCaption}</p>
                      </div>

                      <div class="animal-summary">
                        <template
                          for:each={selectedAnimalFacts}
                          for:item="fact"
                        >
                          <div key={fact.label} class="animal-fact">
                            <span>{fact.label}</span>
                            <strong>{fact.value}</strong>
                          </div>
                        </template>
                      </div>
                    </section>
                  </template>
                </section>
              </template>
            </aside>
          </template>
        </div>
      </template>

      <template if:false={hasMap}>
        <div class="empty-state">
          <h3>No estate map found</h3>
          <p>
            Create and publish an Animal360 estate map to show live animal
            locations.
          </p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
